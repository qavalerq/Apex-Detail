<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="silver-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="4" />
  
  <!-- Outer Speed Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#neon-cyan)" stroke-width="3" stroke-dasharray="14 10" opacity="0.4" />
  
  <!-- Inner Shield / Apex Diamond -->
  <path d="M 256 90 L 390 190 L 350 360 L 256 420 L 162 360 L 122 190 Z" 
        fill="#0b0f19" stroke="url(#neon-cyan)" stroke-width="6" filter="url(#glow)" />

  <!-- Aerodynamic Car Silhouette Contour in Cyan Neon -->
  <path d="M 170 300 Q 210 240 256 220 Q 310 240 342 300 L 350 320 Q 330 330 256 330 Q 182 330 162 320 Z" 
        fill="url(#silver-sheen)" opacity="0.9" />

  <!-- Laser Glint Winglets -->
  <path d="M 256 140 L 310 230 L 256 210 L 202 230 Z" fill="url(#neon-cyan)" filter="url(#glow)" />

  <!-- Speed Dash Center -->
  <line x1="256" y1="210" x2="256" y2="330" stroke="#38bdf8" stroke-width="4" filter="url(#glow)" />
  <circle cx="256" cy="270" r="6" fill="#ffffff" />
</svg>
